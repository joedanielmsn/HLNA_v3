name: HLNA v3 desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hlna-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAN_REF: 49a84bdeaebdfc0f36c00f252eb638f516a48432
  YARN_VERSION: 4.5.3

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Check out HLNA
        uses: actions/checkout@v4

      - name: Check out pinned Jan source
        uses: actions/checkout@v4
        with:
          repository: janhq/jan
          ref: ${{ env.JAN_REF }}
          path: upstream/jan

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
          corepack yarn --version

      - name: Install native build tools
        shell: pwsh
        run: choco install llvm ninja cmake make --yes --no-progress

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Git long paths for llama.cpp checkout
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Build Jan desktop app
        shell: bash
        working-directory: upstream/jan
        run: |
          yarn config set -H enableImmutableInstalls false
          make build JAN_ENGINE_VARIANT=cpu

      - name: Collect Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem "upstream/jan/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "Tauri did not produce an NSIS installer." }
          Copy-Item $nsis.FullName "dist/HLNA-windows-x64-setup.exe"
          Get-ChildItem "upstream/jan/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist/$($_.Name)"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hlna-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  cachyos:
    name: Linux AppImage and CachyOS package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out HLNA
        uses: actions/checkout@v4

      - name: Check out pinned Jan source
        uses: actions/checkout@v4
        with:
          repository: janhq/jan
          ref: ${{ env.JAN_REF }}
          path: upstream/jan

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make curl wget file git libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf libfuse2 libvulkan-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
          corepack yarn --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Jan desktop app
        working-directory: upstream/jan
        run: |
          yarn config set -H enableImmutableInstalls false
          make build JAN_ENGINE_VARIANT=cpu

      - name: Collect AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          appimage="$(find upstream/jan/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          install -m 755 "$appimage" dist/HLNA.AppImage

      - name: Build CachyOS pacman package
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/work" -v "$PWD/packaging/arch:/packaging:ro" archlinux:base-devel bash -lc '
            pacman -Sy --noconfirm --needed archlinux-keyring
            useradd -m builder
            cp /work/HLNA.AppImage /home/builder/
            cp /packaging/PKGBUILD /packaging/hlna.desktop /packaging/hlna.svg /packaging/hlna-launcher.sh /packaging/LICENSE /home/builder/
            chown -R builder:builder /home/builder
            su builder -c "cd /home/builder && makepkg --nodeps --noconfirm"
            cp /home/builder/*.pkg.tar.zst /work/HLNA-cachyos-x86_64.pkg.tar.zst
          '

      - name: Generate checksums
        run: |
          cd dist
          sha256sum HLNA.AppImage HLNA-cachyos-x86_64.pkg.tar.zst > SHA256SUMS

      - name: Upload CachyOS build
        uses: actions/upload-artifact@v4
        with:
          name: hlna-cachyos-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, cachyos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: hlna-windows-x64
          path: release-assets

      - name: Download CachyOS package
        uses: actions/download-artifact@v4
        with:
          name: hlna-cachyos-x86_64
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
